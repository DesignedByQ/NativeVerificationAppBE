spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mydatabase
    username: myuser
    password: mypassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  api-Key: ${API_KEY:}

server:
  servlet:
    session:
      cookie:
        secure: false # Works over http://localhost