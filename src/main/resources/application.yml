spring:
  profiles:
    # Defaults to 'local' if SPRING_PROFILES_ACTIVE environment variable is not set
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    activate:
      on-profile: local
  jpa:
    open-in-view: false
  # Configure Redis Store
  data:
    redis:
      host: localhost # for production use this ${SPRING_REDIS_HOST:redis}
      port: 6379
      ssl:
        enabled: false


  # Configure Spring Session Store
  session:
    store-type: redis
    timeout: 30m               # Session inactive timeout (30 mins)
    redis:
      namespace: myapp:session # Isolated Redis key prefix

server:
  port: 8080
  servlet:
    session:
      cookie:
        name: SESSIONID
        http-only: true        # Mitigate XSS attacks
        secure: true           # Transmit over HTTPS only
        same-site: strict      # Mitigate CSRF attacks
        max-age: -1            # Session cookie (expires when browser closes)