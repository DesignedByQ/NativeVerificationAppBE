services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PROD_DB_USER:-myuser}
      POSTGRES_PASSWORD: ${PROD_DB_PASS:-mypassword}
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROD_DB_USER:-myuser} -d mydatabase"]
      interval: 3s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: spring_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=${APP_ENV:-production}
      - DB_URL=jdbc:postgresql://postgres_db:5432/mydatabase
      - DB_USERNAME=${PROD_DB_USER:-myuser}
      - DB_PASSWORD=${PROD_DB_PASS:-mypassword}

volumes:
  postgres_data:
    driver: local