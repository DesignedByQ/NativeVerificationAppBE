services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PROD_DB_USER:-myuser}
      POSTGRES_PASSWORD: ${PROD_DB_PASS:-mypassword}
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: . # Builds using a Dockerfile at repo root (or replace with image: my-spring-app:latest)
    container_name: spring_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - SPRING_PROFILES_ACTIVE=${APP_ENV:-local}
      - DB_URL=jdbc:postgresql://postgres_db:5432/mydatabase
      - DB_USERNAME=${PROD_DB_USER}
      - DB_PASSWORD=${PROD_DB_PASS}`

volumes:
  postgres_data:
    driver: local